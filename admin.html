<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Udayashree School - Administration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase Compat SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js?v=4.2"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js?v=4.2"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js?v=4.2"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js?v=4.2"></script>
<body class="bg-gray-50 font-sans antialiased overflow-x-hidden">
    <div id="app" class="flex flex-col h-screen overflow-hidden">
        <!-- Consistent Mobile Header -->
        <header id="main-header" class="bg-blue-700 text-white p-4 shadow-md safe-top flex justify-between items-center">
            <h1 id="page-title" class="text-lg font-bold">Udayashree School</h1>
            <button onclick="handleLogout()" class="text-white hover:text-red-200 active:scale-95 transition-transform">
                <i class="fas fa-sign-out-alt text-lg"></i>
            </button>
        </header>

        <!-- Dynamic Main Content Area -->
        <main id="main-content" class="flex-grow overflow-y-auto p-4 pb-10">
            <!-- Content gets injected by admin.js -->
        </main>
    </div>

    <!-- Logic scripts -->
    <script src="shared.js?v=4.3"></script>
    <script type="module">
        import { SetupModule } from './modules/setupModule.js';
        import { FacultyAddModule, DEFAULT_AVATAR } from './modules/facultyAddModule.js';
        import { StudentAddModule, DEFAULT_STUDENT_AVATAR } from './modules/studentAddModule.js';
        import { StudentViewModule } from './modules/studentViewModule.js';
        import { TeacherViewModule } from './modules/teacherViewModule.js';
        import { StudentEditModule } from './modules/studentEditModule.js';
        import { TeacherEditModule } from './modules/teacherEditModule.js';
        window.SetupModule = SetupModule;
        window.FacultyAddModule = FacultyAddModule;
        window.DEFAULT_AVATAR = DEFAULT_AVATAR;
        window.StudentAddModule = StudentAddModule;
        window.DEFAULT_STUDENT_AVATAR = DEFAULT_STUDENT_AVATAR;
        window.StudentViewModule = StudentViewModule;
        window.TeacherViewModule = TeacherViewModule;
        window.StudentEditModule = StudentEditModule;
        window.TeacherEditModule = TeacherEditModule;
    </script>
    <script src="admin-setup.js?v=5.0"></script>
    <script src="admin-faculty-add.js?v=1.0"></script>
    <script src="admin-student-add.js?v=1.0"></script>
    <script src="admin-student-view.js?v=1.0"></script>
    <script src="admin-teacher-view.js?v=1.0"></script>
    <script src="admin-student-edit.js?v=1.0"></script>
    <script src="admin-teacher-edit.js?v=1.0"></script>
    <script src="admin-subjects.js?v=4.3"></script>
    <script src="admin-students.js?v=4.3"></script>
    <script src="admin-teachers.js?v=4.3"></script>
    <script src="admin-exams.js?v=4.3"></script>
    <script src="admin-tickets.js?v=4.3"></script>
    <script src="admin-core.js?v=4.3"></script>
    
    
</html>
