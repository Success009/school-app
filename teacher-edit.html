<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Udayashree School - Edit Faculty Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-800 min-h-screen flex flex-col">

    <!-- Standard Application Header -->
    <header class="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <h1 class="text-lg font-bold">Udayashree School</h1>
            <span class="text-xs px-2 py-0.5 bg-blue-800 rounded font-bold text-blue-200">Faculty Administration</span>
        </div>
        <div class="flex items-center gap-2">
            <a href="teacher-view.html" class="px-2.5 py-1 bg-blue-800 hover:bg-blue-900 rounded text-xs font-bold transition-colors">
                <i class="fas fa-arrow-left mr-1"></i> Faculty Directory
            </a>
            <a href="admin.html" class="px-2.5 py-1 bg-blue-800 hover:bg-blue-900 rounded text-xs font-bold transition-colors">
                <i class="fas fa-th-large mr-1"></i> Admin Panel
            </a>
        </div>
    </header>

    <!-- Main Application Canvas -->
    <main class="flex-grow p-4 md:p-6 w-full">
        <div id="teacher-edit-container"></div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-box" class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"></div>

    <!-- Scripts -->
    <script src="shared.js?v=4.3"></script>
    <script type="module">
        import { TeacherEditModule, DEFAULT_AVATAR } from './modules/teacherEditModule.js';
        window.TeacherEditModule = TeacherEditModule;
        window.DEFAULT_AVATAR = DEFAULT_AVATAR;
    </script>
    <script src="admin-teacher-edit.js"></script>

    <script>
        function showToast(message, type = 'info') {
            const box = document.getElementById('toast-box');
            if (!box) return;
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-red-600 text-white',
                info: 'bg-blue-700 text-white'
            };
            toast.className = `${colors[type] || colors.info} px-4 py-2.5 rounded-xl text-xs font-bold shadow-lg flex items-center gap-2 pointer-events-auto transition-opacity duration-300`;
            toast.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;
            box.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Initialize when DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (typeof initTeacherEdit === 'function') {
                    const urlParams = new URLSearchParams(window.location.search);
                    const tid = urlParams.get('id') || 'TEA-0218';
                    initTeacherEdit('teacher-edit-container', tid);
                }
            }, 80);
        });
    </script>
</body>
</html>
